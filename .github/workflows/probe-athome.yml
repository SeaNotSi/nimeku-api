name: probe-athome
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: proxy candidates for at-home json
        run: |
          CH=1ec0bbf3-f940-405c-a266-23a0b6118f8b
          TARGET="https://api.mangadex.org/at-home/server/$CH"
          ENC=$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "$TARGET")
          probe() {
            name="$1"; url="$2"
            echo "--- $name"
            curl -s -m 25 -o /tmp/body -D /tmp/hdr -H "Origin: https://seanotsi.github.io" "$url"
            grep -iE '^(HTTP/|access-control-allow-origin|content-type)' /tmp/hdr | tr -d '\r'
            head -c 90 /tmp/body | tr -d '\n'; echo
            node -e 'try{const j=JSON.parse(require("fs").readFileSync("/tmp/body","utf8"));console.log("JSON ok, hash",j.chapter&&j.chapter.hash,"files",j.chapter&&j.chapter.data&&j.chapter.data.length)}catch(e){console.log("not raw json")}'
          }
          probe allorigins "https://api.allorigins.win/raw?url=$ENC"
          probe codetabs "https://api.codetabs.com/v1/proxy?quest=$ENC"
          probe jina "https://r.jina.ai/$TARGET"
          probe corsproxy "https://corsproxy.io/?url=$ENC"
