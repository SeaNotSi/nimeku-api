name: probe-md
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: cors + hotlink probe
        run: |
          CH=1ec0bbf3-f940-405c-a266-23a0b6118f8b
          echo "=== at-home FULL headers (Origin github.io) ==="
          curl -s -o /dev/null -D - -H "Origin: https://seanotsi.github.io" "https://api.mangadex.org/at-home/server/$CH"
          echo "=== at-home FULL headers (no Origin) ==="
          curl -s -o /dev/null -D - "https://api.mangadex.org/at-home/server/$CH"
          echo "=== chapter metadata FULL headers (Origin github.io) ==="
          curl -s -o /dev/null -D - -H "Origin: https://seanotsi.github.io" "https://api.mangadex.org/chapter/$CH"
          echo "=== OPTIONS preflight ==="
          curl -s -o /dev/null -D - -X OPTIONS -H "Origin: https://seanotsi.github.io" -H "Access-Control-Request-Method: GET" "https://api.mangadex.org/at-home/server/$CH"
